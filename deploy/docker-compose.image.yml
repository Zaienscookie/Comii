services:
  comii:
    image: comii:2.24.0
    container_name: comii
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      COMII_LIBRARY: /library
      COMII_DATA: /data
      COMII_PORT: "8000"
      COMII_API_PORT: "8001"
      COMII_MAX_UPLOAD_MB: "2048"
      COMII_LOG_LEVEL: info
    volumes:
      - /volume1/docker/comii/data:/data
      - /volume1/comic:/library/comic
      - /volume1/video:/library/video
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/api/v1/ping', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
