services:
  # 一次性准备：在媒体目录里建好「收藏夹」软链（指向容器内 /data/收藏夹）
  # 媒体库本身可以只读；收藏夹落在可写的 ./data 下
  prepare:
    build: .
    image: comii:latest
    container_name: comii-prepare
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /data/收藏夹 &&
        [ -e "/media/收藏夹" ] || ln -sfn /data/收藏夹 "/media/收藏夹"
    volumes:
      - ./data:/data
      - ${COMII_MEDIA_DIR:-./library}:/media

  comii:
    build: .
    image: comii:latest
    container_name: comii
    restart: unless-stopped
    depends_on:
      prepare:
        condition: service_completed_successfully
    ports:
      - "8000:8000"   # WebUI
      - "8001:8001"   # App / API
    environment:
      # 首次启动会自动创建 Owner（不填用户名默认 admin；密码留空则随机生成并打印在日志里）
      COMII_OWNER_USER: "${COMII_OWNER_USER:-admin}"
      COMII_OWNER_PASSWORD: "${COMII_OWNER_PASSWORD:-}"
      # 留空则自动生成，并写进 ./data/server.conf
      COMII_ACCESS_TOKEN: "${COMII_ACCESS_TOKEN:-}"
      COMII_AUTH_ENABLED: "1"
      COMII_MAX_UPLOAD_MB: "2048"
    volumes:
      - ${COMII_MEDIA_DIR:-./library}:/library:ro   # 媒体目录只读；收藏夹由 prepare 软链到 /data/收藏夹, 去掉 :ro 表示文件夹可读写, 这样就能上传资源和创建文件夹了
      - ./data:/data                                # 账号、缩略图、回收站、更新包
