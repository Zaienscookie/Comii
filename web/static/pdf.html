<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<title>Comii · PDF</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { background: #000; color: #eee; margin: 0; }
  .pdf-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center;
    gap: 10px; padding: 10px 14px; background: rgba(10,10,12,.82); backdrop-filter: blur(8px); }
  .pdf-bar button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.06); color: #eee; display: flex; align-items: center; justify-content: center; }
  .pdf-bar .t { font-size: 15px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pdf-bar .n { font-size: 12px; color: #9aa0a6; }
  .pdf-pages { padding: 64px 0 40px; display: flex; flex-direction: column; gap: 4px; }
  .pdf-page { width: 100%; display: block; background: #111; }
  .pdf-page.failed { height: 120px; }
  .pdf-grid { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.94); overflow-y: auto;
    padding: 64px 10px 30px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pdf-grid.hidden { display: none; }
  .pdf-grid .g { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .pdf-grid img { width: 100%; border-radius: 5px; background: #1a1a1c; aspect-ratio: .72; object-fit: cover; }
  .pdf-grid span { font-size: 10px; color: #9aa0a6; }
</style>
</head>
<body>
<div class="pdf-bar">
  <button id="backBtn" aria-label="返回">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="t" id="pdfTitle">PDF</div>
  <div class="n" id="pdfCount">…</div>
  <button id="gridBtn" aria-label="全部页面" title="全部页面">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
  </button>
</div>
<div class="pdf-grid hidden" id="pdfGrid"></div>
<div class="pdf-pages" id="pdfPages"></div>
<script src="/static/config.js"></script>
<script src="/static/pdf.js"></script>
</body>
</html>
