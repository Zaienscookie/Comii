<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>阅读</title>
<link rel="stylesheet" href="/static/style.css">
<script>
  /* 防白闪：立即应用主题，避免加载期底板白色 */
  (function(){
    try {
      var t = localStorage.getItem("komi-theme") || "auto";
      if (t === "auto") t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      document.documentElement.dataset.theme = t;
      document.documentElement.style.background = (t === "dark" ? "#000000" : "#f2f2f7");
    } catch(e) {
      document.documentElement.dataset.theme = "dark";
      document.documentElement.style.background = "#000000";
    }
  })();
</script>
</head>
<body>
<div class="reader-toolbar" id="toolbar">
  <button class="back-btn" id="backBtn" aria-label="返回">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <span class="tt" id="title">…</span>
  <button class="icon-btn" id="settingsToggle" aria-label="阅读设置" title="阅读设置">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03z"/></svg>
  </button>
  <button class="icon-btn" id="themeToggle" aria-label="切换主题">
    <svg id="iconSun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg id="iconMoon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</div>

<main class="reader-canvas" id="canvas">
  <div class="reader-vscroll" id="vscroll"></div>
  <div class="reader-hscroll" id="hscroll"></div>
</main>

<div class="reader-page-nav">
  <button id="prevBtn" aria-label="上一页">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button id="nextBtn" aria-label="下一页">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</div>

<div class="reader-progress"><div class="bar" id="bar"></div></div>
<div class="reader-pageinfo" id="pageInfo">1 / 0</div>
<div class="reader-gridbtn" id="gridBtn" aria-label="全局浏览" title="全局浏览">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
</div>
<div class="reader-gridsheet" id="gridSheet">
  <div class="gridsheet-header">
    <span class="gridsheet-title">全局浏览</span>
    <span class="gridsheet-close" id="gridClose">×</span>
  </div>
  <div class="gridsheet-grid" id="gridGrid"></div>
</div>

<!-- Reading settings bottom sheet (like e-hentai) -->
<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="阅读设置">
  <div class="sheet-handle"></div>
  <div class="sheet-title">阅读设置</div>

  <div class="setting-group">
    <div class="setting-label">阅读模式</div>
    <div class="setting-row">
      <button class="seg" data-s="mode" data-v="vert">垂直滚动</button>
      <button class="seg" data-s="mode" data-v="horiz">左右翻页</button>
    </div>
  </div>

  <div class="setting-group">
    <div class="setting-label">翻页效果</div>
    <div class="setting-row">
      <button class="seg" data-s="effect" data-v="slide">滑动</button>
      <button class="seg" data-s="effect" data-v="fade">淡入</button>
      <button class="seg" data-s="effect" data-v="none">无</button>
    </div>
  </div>

  <div class="setting-group">
    <div class="setting-label">点击屏幕翻页</div>
    <div class="setting-row">
      <label class="switch">
        <input type="checkbox" id="tapTurn" data-s="tap">
        <span class="switch-slider"></span>
      </label>
    </div>
  </div>

  <div class="setting-group">
    <div class="setting-label">进度条</div>
    <div class="setting-row">
      <label class="switch">
        <input type="checkbox" id="showProgress" data-s="progress">
        <span class="switch-slider"></span>
      </label>
    </div>
  </div>

  <div class="setting-group">
    <div class="setting-label">横图旋转（宽>高自动旋转）</div>
    <div class="setting-row">
      <label class="switch">
        <input type="checkbox" id="landscapeRotate" data-s="landscape">
        <span class="switch-slider"></span>
      </label>
    </div>
  </div>

  <div class="setting-group">
    <div class="setting-label">主题</div>
    <div class="setting-row">
      <button class="seg" data-s="theme" data-v="light">浅色</button>
      <button class="seg" data-s="theme" data-v="dark">深色</button>
      <button class="seg" data-s="theme" data-v="auto">自动</button>
    </div>
  </div>
</div>

<script src="/static/config.js?v=20261112"></script>
<script src="/static/reader.js?v=20261112"></script>
</body>
</html>
