<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2f2f7">
<title>Comii.</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <h1 class="logo">Comii<span class="dot">.</span></h1>
    <div class="nav-right">
      <a href="/admin.html" class="icon-btn" title="用户与权限" aria-label="用户与权限" style="text-decoration:none;font-size:12px">用户</a>
      <button id="searchToggle" class="icon-btn" aria-label="搜索" title="搜索">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button id="addToggle" class="icon-btn" aria-label="新建相册" title="新建相册">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="moreToggle" class="icon-btn" aria-label="更多" title="更多">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="container">
  <section class="hero">
    <h2 class="hero-title">相册</h2>
    <p class="hero-sub" id="heroSub">正在扫描…</p>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="搜索相册、系列或文件名…" autocomplete="off">
    </div>
  </section>

  <nav class="breadcrumb folder-feature" id="breadcrumb" aria-label="路径"></nav>

  <button class="new-folder-btn folder-feature" id="newFolderBtn" aria-label="新建文件夹" title="新建文件夹">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M12 10v6M9 13h6"/></svg>
    <span>新建文件夹</span>
  </button>

  <section id="grid" class="grid" aria-live="polite"></section>
  <section id="mediaGrid" class="grid media-grid" aria-live="polite" hidden></section>

  <div id="mediaBar" class="media-bar hidden">
    <span id="mediaBarCount">已选 0 项</span>
    <div class="media-bar-actions">
      <button id="mediaShare" class="media-bar-btn">分享</button>
      <button id="mediaDelete" class="media-bar-btn danger">删除</button>
      <button id="mediaCancel" class="media-bar-btn">取消</button>
    </div>
  </div>

  <div class="sheet-overlay" id="tagsOverlay"></div>
  <div class="sheet" id="tagsSheet" role="dialog" aria-label="标签">
    <div class="sheet-handle"></div>
    <div class="sheet-title">标签</div>
    <div class="setting-label" id="tagsHint">点标签查看带该标签的系列</div>
    <div id="tagsList" class="tags-list"></div>
  </div>
  <div id="empty" class="empty hidden">
    <div class="empty-icon">
      <svg viewBox="0 0 48 48" width="52" height="52" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 13c-3-2.6-7.5-4-13-4v26c5.5 0 10 1.4 13 4 3-2.6 7.5-4 13-4V9c-5.5 0-10 1.4-13 4z"/>
        <path d="M24 13v26"/>
      </svg>
    </div>
    <p>把漫画/视频文件夹放入 <code>library/</code> 目录即可</p>
  </div>

  <!-- 编辑模式底部操作栏 -->
  <div class="edit-bar" id="editBar">
    <span class="edit-count" id="editCount">未选择项目</span>
    <button class="edit-btn" id="editSelectAllBtn" title="全选">全选</button>
    <button class="edit-btn" id="editRenameBtn" disabled title="重命名">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      <span>重命名</span>
    </button>
    <button class="edit-btn" id="editMoveBtn" disabled title="移动">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
      <span>移动</span>
    </button>
    <button class="edit-btn danger" id="editDelBtn" disabled title="删除">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/><path d="M10 11v6M14 11v6"/></svg>
      <span>删除</span>
    </button>
  </div>
</main>

<footer class="footer">
  <p>Comii. Reader · 本地漫画 & 视频</p>
</footer>

<!-- 新建文件夹弹窗 -->
<div class="sheet-overlay" id="folderOverlay"></div>
<div class="sheet" id="folderSheet" role="dialog" aria-label="新建文件夹">
  <div class="sheet-handle"></div>
  <div class="sheet-title">新建文件夹</div>
  <div class="setting-group">
    <div class="setting-label">文件夹名称</div>
    <div class="setting-row">
      <input class="text-input" id="folderName" type="text" placeholder="例如：同人志 / 作者A" autocomplete="off">
    </div>
  </div>
  <div class="setting-group">
    <div class="setting-label">位置</div>
    <div class="setting-row">
      <input class="text-input" id="folderParent" type="text" placeholder="上级文件夹路径（留空=根目录）" autocomplete="off">
    </div>
  </div>
  <div class="setting-group">
    <div class="setting-label">内容类型</div>
    <div class="setting-row">
      <div class="type-seg" id="folderKind">
        <button type="button" class="type-opt active" data-kind="manga">漫画</button>
        <button type="button" class="type-opt" data-kind="video">视频</button>
      </div>
    </div>
  </div>
  <button class="sheet-btn" id="folderCreate">创建</button>
</div>

<!-- 移动/归类弹窗 -->
<div class="sheet-overlay" id="moveOverlay"></div>
<div class="sheet" id="moveSheet" role="dialog" aria-label="移动">
  <div class="sheet-handle"></div>
  <div class="sheet-title">移动到</div>
  <div class="move-targets" id="moveTargets"></div>
  <button class="sheet-btn primary" id="movePaste" style="margin-top:12px">粘贴到此处</button>
</div>

<!-- 导入内容弹窗 -->
<div class="sheet-overlay" id="importOverlay"></div>
<div class="sheet" id="importSheet" role="dialog" aria-label="导入内容">
  <div class="sheet-handle"></div>
  <div class="sheet-title">导入内容</div>
  <div class="setting-group">
    <div class="setting-label">选择文件（可多选：图片 / PDF / ZIP / CBZ / 7Z / 视频）</div>
    <div class="setting-row">
      <input type="file" id="importFiles" multiple
        accept="image/*,application/pdf,.pdf,.zip,.cbz,.7z,video/*" class="text-input">
    </div>
    <div class="drop-zone" id="importDrop">也可以把文件 / 文件夹拖到这里</div>
    <div class="import-list" id="importList"></div>
  </div>
  <div class="setting-group">
    <div class="setting-label">名称（留空 = 文件名；多文件时作为系列名）</div>
    <div class="setting-row">
      <input class="text-input" id="importName" type="text" placeholder="例如：某漫画第1卷" autocomplete="off">
    </div>
  </div>
  <div class="setting-group">
    <div class="setting-label">目标文件夹（相对路径，留空 = 根目录）</div>
    <div class="setting-row">
      <input class="text-input" id="importFolder" type="text" placeholder="例如：作者A（留空=根目录）" autocomplete="off">
    </div>
  </div>
  <div class="import-progress"><div class="import-progress-bar" id="importProgressBar"></div></div>
  <div class="setting-label" id="importStatus"></div>
  <button class="sheet-btn primary" id="importStart" style="margin-top:12px">开始上传</button>
</div>

<!-- 重命名弹窗 -->
<div class="sheet-overlay" id="renameOverlay"></div>
<div class="sheet" id="renameSheet" role="dialog" aria-label="重命名">
  <div class="sheet-handle"></div>
  <div class="sheet-title">重命名</div>
  <div class="setting-group">
    <div class="setting-label">新名称</div>
    <div class="setting-row">
      <input class="text-input" id="renameInput" type="text" placeholder="输入新名称" autocomplete="off">
    </div>
  </div>
  <button class="sheet-btn primary" id="renameSave" style="margin-top:12px">保存</button>
</div>

<!-- 回收站弹窗 -->
<div class="sheet-overlay" id="trashOverlay"></div>
<div class="sheet" id="trashSheet" role="dialog" aria-label="回收站">
  <div class="sheet-handle"></div>
  <div class="sheet-title">回收站<span class="sheet-sub" id="trashCount"></span></div>
  <div class="move-targets" id="trashList"></div>
  <button class="sheet-btn primary" id="trashClose" style="margin-top:12px">关闭</button>
</div>

<!-- Server settings sheet -->
<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="服务器设置">
  <div class="sheet-handle"></div>
  <div class="sheet-title">服务器设置</div>

  <div class="setting-group">
    <div class="setting-label">服务器地址</div>
    <div class="setting-row" style="flex-direction:column;align-items:stretch;gap:10px">
      <input type="url" id="serverInput" class="text-input" placeholder="留空 = 当前站点 或 输入 http://IP:8000" autocomplete="off" spellcheck="false">
      <div style="display:flex;gap:10px">
        <button id="serverTest" class="btn">测试连接</button>
        <button id="serverScan" class="btn">扫描局域网</button>
        <button id="serverSave" class="btn primary">保存</button>
      </div>
      <div id="serverStatus" class="server-status"></div>
      <div id="scanResults" class="scan-results"></div>
    </div>
  </div>
</div>

<script src="/static/auth-guard.js"></script>
<script src="/static/config.js"></script>
<script src="/static/app.js"></script>
<div class="sheet-overlay" id="moreOverlay"></div>
<div class="sheet" id="moreSheet" role="dialog" aria-label="更多">
  <div class="sheet-handle"></div>
  <div class="sheet-title">更多</div>
  <div class="more-list">
    <button id="importToggle" class="more-item">导入内容</button>
    <button id="tagsToggle" class="more-item">标签</button>
    <button id="trashToggle" class="more-item">回收站</button>
    <button id="editToggle" class="more-item">编辑</button>
    <button id="themeToggle" class="more-item">切换主题</button>
    <button id="serverToggle" class="more-item">服务器设置</button>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav">
  <button class="bn-item" data-view="photos">照片</button>
  <button class="bn-item active" data-view="albums">相册</button>
</nav>
</body>
</html>
