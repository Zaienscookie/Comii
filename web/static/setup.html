<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comii · 安全设置</title>
<link rel="stylesheet" href="/static/style.css">
<style>
*{box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 800px at 50% -10%,#15161c,#0b0b0d 60%,#07070a);color:var(--text,#fff);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:20px}
.card{position:relative;width:min(94vw,430px);padding:30px;border-radius:24px;background:rgba(23,23,26,.94);box-shadow:0 30px 80px #000a,inset 0 1px 0 #ffffff10;animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
h1{margin:0 0 6px;font-size:26px}
p.sub{color:#8e8e93;font-size:13px;margin:0 0 20px;line-height:1.7}
label{display:block;font-size:12px;color:#8e8e93;margin:12px 0 5px}
input{width:100%;padding:13px 14px;border:1px solid #2c2c31;border-radius:13px;background:#1d1d21;color:#fff;font-size:15px;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
input:focus{outline:none;border-color:#0a84ff;background:#202027;box-shadow:0 0 0 4px #0a84ff22}
button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:13px;background:linear-gradient(180deg,#0a84ff,#0a6fdd);color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 10px 24px #0a84ff33;transition:transform .12s ease,filter .2s ease}
button:hover{filter:brightness(1.06)}
button:active{transform:scale(.975)}
button:disabled{opacity:.6;cursor:not-allowed}
.error{color:#ff453a;font-size:13px;margin-top:10px;min-height:18px}
.error.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.token{font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px;background:#0d0d0f;padding:14px;border-radius:12px;word-break:break-all;user-select:all;border:1px dashed #0a84ff66;margin-top:10px;animation:fadeUp .4s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ok{color:#30d158;font-size:13px;margin-top:10px}
a{color:#0a84ff;text-decoration:none;display:inline-block;margin-top:16px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>安全设置</h1>
  <p class="sub">首次登录必须完成以下设置：<br>① 重新设定用户名与密码 ② 生成新的服务器令牌（只显示一次）</p>
  <div id="formBox">
    <label>新用户名</label>
    <input id="username" placeholder="新的用户名" autocomplete="username">
    <label>新密码（至少 6 位）</label>
    <input id="password" type="password" placeholder="新的密码" autocomplete="new-password">
    <label>确认新密码</label>
    <input id="password2" type="password" placeholder="再次输入" autocomplete="new-password">
    <button id="save">保存并生成令牌</button>
    <div class="error" id="error"></div>
  </div>
  <div id="doneBox" class="hidden">
    <p class="sub" style="margin-bottom:4px">设置完成。新的服务器令牌如下，<b>只显示这一次</b>：</p>
    <div class="token" id="tokenText"></div>
    <button id="copy" style="margin-top:12px">复制令牌</button>
    <div class="ok" id="copied" style="color:#8e8e93"></div>
    <button id="relogin" style="margin-top:14px">用新账号重新登录</button>
    <div class="ok" id="reloginTip" style="color:#8e8e93"></div>
  </div>
</div>
<script>
const errorEl = document.getElementById('error');
const save = document.getElementById('save');
function showError(text) {
  errorEl.textContent = text;
  errorEl.classList.remove('shake');
  void errorEl.offsetWidth;
  errorEl.classList.add('shake');
}
async function api(path, options = {}) {
  const r = await fetch(path, {credentials:'same-origin', headers:{'Content-Type':'application/json'}, ...options});
  if (r.status === 401) { location.href = '/login.html?next=/setup.html'; throw new Error('未登录'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
  return data;
}
async function boot() {
  try {
    const me = await api('/api/v1/auth/me');
    if (!me.user?.must_change) { location.href = '/'; return; }
    document.getElementById('username').value = me.user.username || '';
  } catch (_) {}
}
boot();
save.addEventListener('click', async () => {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  if (!username) return showError('请输入用户名');
  if (password.length < 6) return showError('密码至少 6 位');
  if (password !== password2) return showError('两次密码不一致');
  save.disabled = true;
  save.textContent = '保存中…';
  try {
    const data = await api('/api/v1/auth/rotate', {method:'POST', body: JSON.stringify({username, password})});
    document.getElementById('formBox').classList.add('hidden');
    document.getElementById('doneBox').classList.remove('hidden');
    document.getElementById('tokenText').textContent = data.token;
    window.__newToken = data.token;
    try {
      sessionStorage.setItem('comii_token', data.token);
      localStorage.setItem('comii_access_token', data.token);
    } catch (_) {}
    document.cookie = 'comii_access=' + encodeURIComponent(data.token) + '; path=/; max-age=31536000; SameSite=Lax';
    // 旧 cookie 可能还带着上一枚令牌，先删再写一次，避免“刚改完又被踢回登录”
    document.cookie = 'comii_access=; path=/; max-age=0; SameSite=Lax';
    document.cookie = 'comii_access=' + encodeURIComponent(data.token) + '; path=/; max-age=31536000; SameSite=Lax';
  } catch (e) {
    save.disabled = false;
    save.textContent = '保存并生成令牌';
    showError(e.message);
  }
});
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}
document.getElementById('relogin').addEventListener('click', () => {
  const token = window.__newToken || '';
  const name = document.getElementById('username').value.trim();
  try {
    localStorage.removeItem('comii_access_token');
    sessionStorage.removeItem('comii_token');
    localStorage.setItem('comii_login_user', name);
    if (token) sessionStorage.setItem('comii_token', token);
  } catch (_) {}
  document.cookie = 'comii_access=; path=/; max-age=0; SameSite=Lax';
  const url = '/login.html?next=/' + (token ? '&token=' + encodeURIComponent(token) : '');
  location.href = url;
});
document.getElementById('copy').addEventListener('click', async () => {
  const text = window.__newToken || '';
  const tip = document.getElementById('copied');
  let ok = false;
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); ok = true; } catch (_) { ok = false; }
  }
  if (!ok) ok = fallbackCopy(text);
  tip.textContent = ok ? '已复制' : '已选中，请按 Ctrl+C 复制';
  if (!ok) {
    const box = document.getElementById('tokenText');
    const range = document.createRange();
    range.selectNodeContents(box);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
});
</script>
</body>
</html>
