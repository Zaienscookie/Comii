<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comii · 用户与权限</title>
<link rel="stylesheet" href="/static/style.css">
<style>
body{background:var(--bg,#0b0b0d);color:var(--text,#fff);font-family:system-ui,sans-serif;margin:0}
.wrap{max-width:960px;margin:0 auto;padding:24px}
h1{font-size:28px;margin:0 0 4px}
h3{margin:0 0 6px;font-size:17px}
.sub{color:#8e8e93;font-size:13px;margin-bottom:14px;line-height:1.7}
.card{background:#17171a;border-radius:16px;padding:18px;margin:14px 0}
input,select,button{padding:10px 12px;border:0;border-radius:10px;background:#242428;color:#fff;font-size:14px;margin:4px 4px 4px 0}
button{background:#0a84ff;font-weight:600;cursor:pointer}
button.danger{background:#ff453a}
button.ghost{background:#2c2c31}
button.mini{padding:6px 12px;font-size:12px;margin:0}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:10px 8px;border-bottom:1px solid #2c2c31;vertical-align:middle}
th{color:#8e8e93;font-weight:500;font-size:12px}
tbody tr{cursor:pointer}
tbody tr:hover{background:#1d1d21}
tbody tr.active{background:#0a84ff1a}
.role-pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:#2c2c31;color:#c7c7cc}
.role-pill.owner{background:#0a84ff22;color:#4da3ff}
.role-pill.admin{background:#30d15822;color:#30d158}
.role-pill.viewer{background:#8e8e9322;color:#c7c7cc}
.role-pill.custom{background:#ffd60a22;color:#ffd60a}
.caps{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.caps label{display:flex;align-items:center;gap:6px;font-size:12px;background:#202024;border:1px solid #2c2c31;padding:7px 10px;border-radius:10px;color:#c7c7cc;cursor:pointer}
.caps label:hover{border-color:#0a84ff}
.caps input{width:auto;margin:0;accent-color:#0a84ff}
.caps label.sel{background:#0a84ff1a;border-color:#0a84ff;color:#fff;transform:translateY(-1px)}
.caps label{transition:background .16s ease,border-color .16s ease,transform .16s ease,color .16s ease}
tbody tr{transition:background .16s ease}
.panel{animation:panelIn .22s ease both}
@keyframes panelIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.mini{transition:transform .12s ease,background .16s ease}
.mini:active{transform:scale(.94)}
#users td{transition:color .16s ease}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);opacity:0;background:#0a84ff;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;transition:opacity .2s ease,transform .2s ease;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.msg{font-size:12px;color:#30d158;margin-left:6px}
.msg.err{color:#ff453a}
a{color:#0a84ff}
.preset{color:#8e8e93;font-size:13px;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>用户与权限</h1>
  <div class="sub">只有 Owner 能进这个页面。<a href="/">← 返回媒体库</a></div>

  <div class="card">
    <h3>新建用户</h3>
    <div class="sub">Viewer / Admin / Owner 是预设角色；Custom 建好后点用户行勾选权限。</div>
    <input id="newName" placeholder="用户名">
    <input id="newPass" type="password" placeholder="密码（至少 6 位）">
    <select id="newRole">
      <option value="viewer">Viewer · 只读（预设）</option>
      <option value="admin">Admin · 管理内容（预设）</option>
      <option value="custom" selected>Custom · 自定义权限</option>
      <option value="owner">Owner · 全部权限（预设）</option>
    </select>
    <button onclick="createUser()">创建</button>
    <span id="createMsg" class="msg"></span>
  </div>

  <div class="card">
    <h3>用户列表</h3>
    <div class="sub">点一行 = 选中这个用户，下方出现权限设置；「状态」点一下封禁，再点一下恢复。</div>
    <table>
      <thead><tr><th style="width:52px">ID</th><th>用户名</th><th style="width:100px">角色</th><th style="width:96px">状态</th><th style="width:170px">角色操作</th><th style="width:70px"></th></tr></thead>
      <tbody id="users"></tbody>
    </table>
    <div id="permsPanel"></div>
  </div>

  <div class="card">
    <h3>审计日志</h3>
    <div class="sub">登录、失败登录、修改操作，默认保留 30 天，最近 200 条。</div>
    <button onclick="loadAudit()">刷新日志</button>
    <table style="margin-top:10px">
      <thead><tr><th>时间</th><th>用户</th><th>动作</th><th>路径</th><th>状态</th><th>IP</th></tr></thead>
      <tbody id="audit"></tbody>
    </table>
  </div>
</div>

<script>
const CAPS = [
  ['view', '浏览'],
  ['download', '下载/分享'],
  ['upload', '上传'],
  ['create', '新建文件夹'],
  ['delete', '删除'],
  ['move', '移动/重命名'],
  ['manage', '管理封面/标签'],
];
const ROLE_LABEL = { owner: 'Owner', admin: 'Admin', viewer: 'Viewer', custom: 'Custom' };
const PRESET_HINT = {
  owner: '预设角色：拥有全部权限，不可修改。',
  admin: '预设角色：可管理内容（浏览/下载/上传/新建/删除/移动/封面标签），不可修改。',
  viewer: '预设角色：只读，只能浏览和下载，不可修改。',
};

let users = [];
let me = null;
let selectedId = null;

function toast(text) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1600);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function api(path, options = {}) {
  const r = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...options });
  if (r.status === 401) { location.href = '/login.html?next=/admin.html'; throw new Error('未登录'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
  return data;
}

function grantOf(user) {
  const list = user.grants || [];
  return list.find(g => !g.path_prefix) || null;
}

async function load() {
  const data = await api('/api/v1/admin/users');
  users = data.items || [];
  const isMe = (u) => me && me.user && Number(me.user.id) === Number(u.id);
  const ownerCount = users.filter(u => u.role === 'owner' && u.enabled).length;

  document.getElementById('users').innerHTML = users.map(u => {
    const locked = isMe(u) || (u.role === 'owner' && ownerCount <= 1);
    const roleOptions = ['owner', 'admin', 'viewer', 'custom'].map(r =>
      `<option value="${r}"${r === u.role ? ' selected' : ''}>${ROLE_LABEL[r]}</option>`).join('');
    return `<tr data-id="${u.id}" class="${selectedId === u.id ? 'active' : ''}" onclick="selectUser(${u.id})">
      <td>${u.id}</td>
      <td>${escapeHtml(u.username)}${isMe(u) ? ' <span class="role-pill">我</span>' : ''}</td>
      <td><span class="role-pill ${u.role}">${ROLE_LABEL[u.role] || u.role}</span></td>
      <td><button class="mini ${u.enabled ? 'ghost' : 'danger'}" data-state="${u.enabled ? 'on' : 'off'}" onclick="event.stopPropagation();toggleEnabled(${u.id}, ${u.enabled ? 'false' : 'true'})">${u.enabled ? '启用' : '禁用'}</button></td>
      <td onclick="event.stopPropagation()">
        ${locked
          ? `<span class="sub" style="margin:0">${isMe(u) ? '不能改自己' : '保留 Owner'}</span>`
          : `<select onchange="setRole(${u.id}, this.value)">${roleOptions}</select>`}
      </td>
      <td><button class="danger mini" onclick="event.stopPropagation();delUser(${u.id}, '${escapeHtml(u.username)}')">删除</button></td>
    </tr>`;
  }).join('');

  renderPerms();
}

function selectUser(id) {
  selectedId = (selectedId === id) ? null : id;
  load();
}

function renderPerms() {
  const panel = document.getElementById('permsPanel');
  const user = users.find(u => u.id === selectedId);
  if (!user) { panel.innerHTML = ''; return; }
  if (user.role !== 'custom') {
    panel.innerHTML = `<div class="preset">「${escapeHtml(user.username)}」当前是 <b>${ROLE_LABEL[user.role]}</b>。${PRESET_HINT[user.role] || ''}</div>`;
    return;
  }
  const g = grantOf(user) || {};
  panel.innerHTML = `
    <div class="panel" style="margin-top:14px;padding-top:12px;border-top:1px solid #2c2c31">
      <div class="sub" style="margin-bottom:6px">「${escapeHtml(user.username)}」的权限（仅 Custom 可勾选）</div>
      <div class="caps" id="capsBox">
        ${CAPS.map(([k, label]) => `<label class="${g[k] ? 'sel' : ''}"><input type="checkbox" data-cap="${k}"${g[k] ? ' checked' : ''} onchange="this.closest('label').classList.toggle('sel', this.checked)">${label}</label>`).join('')}
      </div>
      <button onclick="savePerms(${user.id})">保存权限</button>
      <button class="ghost" onclick="document.querySelectorAll('#capsBox input').forEach(i=>i.checked=false)">清空</button>
      <span id="permMsg" class="msg"></span>
    </div>`;
}

async function savePerms(id) {
  const item = { path_prefix: '' };
  document.querySelectorAll('#capsBox input').forEach(i => { item[i.dataset.cap] = i.checked; });
  try {
    await api('/api/v1/admin/users/' + id + '/grants', { method: 'PUT', body: JSON.stringify({ items: [item] }) });
    toast('权限已保存');
    await load();
  } catch (e) {
    toast('保存失败：' + e.message);
    document.getElementById('permMsg').className = 'msg err';
  }
}

async function toggleEnabled(id, enabled) {
  try { await api('/api/v1/admin/users/' + id, { method: 'PATCH', body: JSON.stringify({ enabled }) }); await load(); }
  catch (e) { alert(e.message); }
}

async function createUser() {
  const msg = document.getElementById('createMsg');
  msg.className = 'msg';
  const body = { username: newName.value.trim(), password: newPass.value, role: newRole.value };
  if (!body.username || body.password.length < 6) { msg.textContent = '用户名不能为空，密码至少 6 位'; msg.className = 'msg err'; return; }
  try {
    await api('/api/v1/admin/users', { method: 'POST', body: JSON.stringify(body) });
    msg.textContent = '已创建';
    newName.value = ''; newPass.value = '';
    await load();
  } catch (e) { msg.textContent = '创建失败：' + e.message; msg.className = 'msg err'; }
}

async function setRole(id, role) {
  try { await api('/api/v1/admin/users/' + id, { method: 'PATCH', body: JSON.stringify({ role }) }); await load(); }
  catch (e) { alert(e.message); await load(); }
}

async function delUser(id, name) {
  if (!confirm('确定删除用户「' + name + '」？他的文件不会被删除。')) return;
  try { await api('/api/v1/admin/users/' + id, { method: 'DELETE' }); selectedId = null; await load(); }
  catch (e) { alert(e.message); }
}

async function loadAudit() {
  const data = await api('/api/v1/admin/audit?limit=200');
  document.getElementById('audit').innerHTML = (data.items || []).map(row => {
    const d = new Date(row.ts * 1000).toLocaleString();
    return `<tr><td>${d}</td><td>${escapeHtml(row.username || '')}</td><td>${escapeHtml(row.action || '')}</td><td>${escapeHtml(row.path || '')}</td><td>${row.status || ''}</td><td>${escapeHtml(row.ip || '')}</td></tr>`;
  }).join('');
}

(async () => {
  me = await api('/api/v1/auth/me').catch(() => null);
  if (!me || me.user?.role !== 'owner') {
    document.body.innerHTML = '<div class="wrap"><h1>仅 Owner 可管理用户</h1><p class="sub">Admin 只能管理内容，不能创建用户或分配权限。</p><a href="/">← 返回媒体库</a></div>';
    return;
  }
  await load();
  loadAudit();
})();
</script>
<div class="toast" id="toast"></div>
</body>
</html>
